app = "remix-discord-bot"
primary_region = "dfw"
kill_signal = "SIGINT"
kill_timeout = 10

[env]
PORT = "8080"

[mounts]
source = "data"
destination = "/data"

[[services]]
internal_port = 8080
protocol = "tcp"

  [services.concurrency]
  hard_limit = 25
  soft_limit = 20
  type = "connections"

  [[services.ports]]
  handlers = ["http"]
  port = 80
  force_https = true

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

  [[services.tcp_checks]]
  grace_period = "5s"
  interval = "15s"
  restart_limit = 0
  timeout = "2s"

  [[services.http_checks]]
  grace_period = "10s"
  interval = "30s"
  method = "get"
  path = "/healthcheck"
  protocol = "http"
  timeout = "5s"
  tls_skip_verify = false
